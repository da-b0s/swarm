# For the server owner, if nginx already serves 80/443. Replace HOSTNAME.
# The relayer listens only on 127.0.0.1:8787.
server {
    listen 443 ssl;
    server_name HOSTNAME;
    # ssl_certificate / ssl_certificate_key: as for the owner's other sites (e.g. certbot)
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
